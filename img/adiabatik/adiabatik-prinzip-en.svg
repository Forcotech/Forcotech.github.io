<text x="20" y="72" font-size="13.5" font-weight="700" fill="#2f6f9f">Water, softened</text>
<text x="20" y="90" font-size="12.5" fill="#5c5c5c">Backflow preventer EN 1717</text>
<path d="M166 370 V392 H120" fill="none" stroke="#2f6f9f" stroke-width="3" marker-end="url(#b)"/>
<text x="20" y="412" font-size="13" fill="#5c5c5c">Drain · once-through, no recirculation</text>
<!-- Luftweg -->
<path d="M20 262 H126" stroke="#5c5c5c" stroke-width="4" marker-end="url(#a)"/>
<text x="20" y="236" font-size="14.5" font-weight="700" fill="#1a1a1a">Outdoor air</text>
