<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 430" role="img" aria-label="Vergleich: Bei einer reflektierenden Wand wird der Schall zwischen Anlage und Wand mehrfach hin und her geworfen und strahlt mehrfach über die Krone ab; eine absorbierende HSA3-Wand schluckt ihn auf der Quellseite"><defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c8202f"/></marker>
<marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2a7ab8"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a1a1a"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ece8e8"/><line x1="0" y1="0" x2="0" y2="8" stroke="#bdb6b6" stroke-width="2"/></pattern>
<pattern id="hsa" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#fbe3e6"/><circle cx="5" cy="5" r="1.6" fill="#c8202f"/></pattern>
</defs><rect width="1300" height="430" fill="#fff"/><line x1="650" y1="30" x2="650" y2="410" stroke="#d9d4d4" stroke-width="2"/><line x1="10" y1="380" x2="640" y2="380" stroke="#1a1a1a" stroke-width="3"/><rect x="10" y="380" width="630" height="14" fill="url(#hatch)"/><rect x="50" y="200" width="180" height="180" rx="6" fill="#4a4a4a"/><rect x="70" y="186" width="140" height="14" rx="3" fill="#6b6b6b"/><text x="140.0" y="310" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Anlage</text><rect x="300" y="110" width="18" height="270" fill="#7a7a7a"/><text x="25" y="30" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Reflektierende Wand</text><path d="M230 340 L300 310 L230 280 L300 250 L230 220 L300 190" fill="none" stroke="#c8202f" stroke-width="4" stroke-linejoin="round"/><path d="M230 280 L309 110 L610 300" fill="none" stroke="#c8202f" stroke-width="3.5" opacity=".45" marker-end="url(#ar)"/><path d="M230 220 L309 110 L610 270" fill="none" stroke="#c8202f" stroke-width="3.5" opacity=".7" marker-end="url(#ar)"/><path d="M300 190 L309 110 L610 240" fill="none" stroke="#c8202f" stroke-width="3.5" opacity="1" marker-end="url(#ar)"/><circle cx="300" cy="310" r="6" fill="#fff" stroke="#c8202f" stroke-width="3"/><circle cx="300" cy="250" r="6" fill="#fff" stroke="#c8202f" stroke-width="3"/><circle cx="230" cy="280" r="6" fill="#fff" stroke="#c8202f" stroke-width="3"/><circle cx="230" cy="220" r="6" fill="#fff" stroke="#c8202f" stroke-width="3"/><circle cx="309" cy="110" r="7" fill="#fff" stroke="#c8202f" stroke-width="3"/><text x="360" y="320" font-size="16" fill="#c8202f" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Mehrfachreflexion:</text><text x="360" y="339" font-size="16" fill="#c8202f" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">jede Reflexion strahlt</text><text x="360" y="358" font-size="16" fill="#c8202f" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">zusätzlich über die Krone</text><text x="25" y="75" font-size="15" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Spiegelquellen</text><line x1="90" y1="82" x2="224" y2="216" stroke="#5c5c5c" stroke-width="1.5"/><line x1="665" y1="380" x2="1295" y2="380" stroke="#1a1a1a" stroke-width="3"/><rect x="665" y="380" width="630" height="14" fill="url(#hatch)"/><rect x="705" y="200" width="180" height="180" rx="6" fill="#4a4a4a"/><rect x="725" y="186" width="140" height="14" rx="3" fill="#6b6b6b"/><text x="795.0" y="310" font-size="17" fill="#fff" text-anchor="middle" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Anlage</text><rect x="955" y="110" width="18" height="270" fill="#7a7a7a"/><rect x="941" y="110" width="14" height="270" fill="url(#hsa)"/><text x="680" y="30" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Absorbierende Wand mit HSA3</text><line x1="885" y1="340" x2="937" y2="310" stroke="#c8202f" stroke-width="4" marker-end="url(#ar)"/><line x1="885" y1="280" x2="937" y2="260" stroke="#c8202f" stroke-width="4" marker-end="url(#ar)"/><path d="M885 215 L964 110 L1265 300" fill="none" stroke="#c8202f" stroke-width="3" opacity=".45" marker-end="url(#ar)"/><circle cx="964" cy="110" r="7" fill="#fff" stroke="#c8202f" stroke-width="3"/><text x="1015" y="320" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Schall wird auf der</text><text x="1015" y="339" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="700" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Quellseite geschluckt</text><text x="1015" y="366" font-size="15" fill="#5c5c5c" text-anchor="start" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">Schallenergie → Wärme im HSA3</text></svg>