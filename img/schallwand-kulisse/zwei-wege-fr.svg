<text x="20" y="80" font-size="15" font-weight="700" fill="#c8202f">→ silencieux d’extraction RK-200</text>
<text x="20" y="440" font-size="16" font-weight="700" fill="#1a1a1a">rayonnement latéral (enveloppe, compresseur) → écran acoustique HSA3</text>
