<!-- Haube -->
<rect x="200" y="110" width="480" height="270" fill="none" stroke="#1a1a1a" stroke-width="3"/><line x1="208" y1="116" x2="208" y2="374" stroke="#c8202f" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="672" y1="116" x2="672" y2="374" stroke="#c8202f" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="680" y="405" text-anchor="end" font-size="14.5" font-weight="700" fill="#1a1a1a">Acoustic enclosure with HSA3 lining</text>
