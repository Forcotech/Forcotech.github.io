<path d="M214 262 H322" stroke="#2f6f9f" stroke-width="4" marker-end="url(#b)"/>
<text x="218" y="236" font-size="14" font-weight="700" fill="#2f6f9f">pre-cooled</text>
<text x="218" y="290" font-size="13.5" font-weight="700" fill="#2f6f9f">≈ 26–29 °C</text>
<rect x="472" y="122" width="196" height="54" rx="8" fill="#fff" stroke="#e6e1e1"/>
<text x="570" y="145" text-anchor="middle" font-size="12.5" fill="#1a1a1a">6–9 K cooling</text>
<text x="570" y="164" text-anchor="middle" font-size="12.5" fill="#5c5c5c">&lt; 25 Pa additional (target)</text>
